# PR titles must be Conventional Commits: with squash merges the title becomes the commit message,
# and the commit messages decide the next version (fix -> patch, feat -> minor, ! -> major).
name: pr-title

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # "feat!:" / "fix!:" mark breaking changes.
          headerPattern: '^(\w*)(?:\(([\w$.\-*/ ]*)\))?!?: (.*)$'
          headerPatternCorrespondence: type, scope, subject
